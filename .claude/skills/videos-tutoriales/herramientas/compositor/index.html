<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Órbita · compositor de videos tutoriales</title>
<style>
@font-face{font-family:'Geist';font-style:normal;font-weight:100 900;src:url(fonts/geist-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Geist';font-style:normal;font-weight:100 900;src:url(fonts/geist-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Sora';font-style:normal;font-weight:100 900;src:url(fonts/sora-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Sora';font-style:normal;font-weight:100 900;src:url(fonts/sora-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{ --primary:#3B82F6; --primary-h:#2563EB; --text:#0F172A; --muted:#64748B; }
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:
    radial-gradient(1100px 760px at 12% 6%, rgba(37,99,235,.55) 0%, transparent 62%),
    radial-gradient(900px 700px at 96% 104%, rgba(59,130,246,.40) 0%, transparent 60%),
    linear-gradient(158deg,#0C1A3D 0%,#0A1432 48%,#060B1E 100%)}
#rings{position:absolute;inset:0}
#noise{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none}
canvas{position:absolute;left:0;top:0}

/* ── Diálogo "Abrir" (recreación de Windows 11) ───────────────── */
#dlg{position:absolute;left:520px;top:250px;width:880px;height:560px;border-radius:8px;overflow:hidden;opacity:0;
  font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;font-size:13px;color:#1A1A1A;
  background:linear-gradient(180deg,#EEF2F7 0%,#F3F3F3 120px);border:1px solid rgba(0,0,0,.14);
  box-shadow:0 32px 64px rgba(0,0,0,.30),0 2px 21px rgba(0,0,0,.20);transform-origin:50% 50%}
#dlg .tb{position:absolute;left:0;top:0;right:0;height:34px;display:flex;align-items:center;padding-left:14px;gap:10px;font-size:12px}
#dlg .tb .x{position:absolute;right:0;top:0;width:46px;height:34px;display:grid;place-items:center;color:#333}
#dlg .tool{position:absolute;left:0;right:0;top:34px;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px}
#dlg .ib{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;color:#555}
#dlg .addr{flex:1;height:32px;border-radius:4px;background:#fff;border:1px solid #E5E5E5;display:flex;align-items:center;gap:6px;padding:0 10px;color:#1A1A1A}
#dlg .addr .sep{color:#8A8A8A}
#dlg .search{width:240px;height:32px;border-radius:4px;background:#fff;border:1px solid #E5E5E5;display:flex;align-items:center;gap:8px;padding:0 10px;color:#767676}
#dlg .cmd{position:absolute;left:0;right:0;top:80px;height:40px;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid #E5E5E5;color:#1A1A1A}
#dlg .cmd span{display:flex;align-items:center;gap:6px}
#dlg .nav{position:absolute;left:0;top:120px;width:196px;bottom:104px;padding:8px 6px;border-right:1px solid #E8E8E8;background:rgba(255,255,255,.35)}
#dlg .nav div{height:30px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:4px}
#dlg .nav div.sel{background:#E0E7F1}
#dlg .nav hr{border:0;border-top:1px solid #E1E1E1;margin:6px 8px}
#dlg .content{position:absolute;left:196px;right:0;top:120px;bottom:104px;background:#fff}
#dlg .item{position:absolute;top:18px;width:136px;height:170px;border-radius:4px;border:1px solid transparent;text-align:center}
#dlg .item.sel{background:#CCE8FF;border-color:#99D1FF}
#dlg .item .th{width:120px;height:112px;margin:8px auto 6px;display:grid;place-items:center}
#dlg .item .th img{max-width:116px;max-height:110px;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.18)}
#dlg .item .nm{font-size:12px;line-height:16px;padding:0 6px;word-break:break-all}
#dlg .foot{position:absolute;left:0;right:0;bottom:0;height:104px;border-top:1px solid #E5E5E5;background:#F3F3F3}
#dlg .row1{position:absolute;left:22px;right:22px;top:16px;display:flex;align-items:center;gap:10px}
#dlg .fname{flex:1;height:30px;border-radius:4px;background:#fff;border:1px solid #D9D9D9;border-bottom:2px solid #005FB8;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;font-size:12.5px}
#dlg .filter{width:270px;height:30px;border-radius:4px;background:#fff;border:1px solid #D9D9D9;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12.5px;white-space:nowrap;overflow:hidden}
#dlg .btn{position:absolute;top:58px;width:96px;height:32px;border-radius:4px;display:grid;place-items:center;font-size:13px}
#dlg .btn.ok{right:132px;background:#005FB8;color:#fff;border:1px solid #0067C0}
#dlg .btn.ok.press{background:#00508F}
#dlg .btn.no{right:24px;background:#fff;border:1px solid #D0D0D0}
#key{position:absolute;opacity:0;padding:6px 12px;border-radius:8px;background:#0F172A;color:#fff;font:600 18px/1 'Geist';box-shadow:0 8px 20px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}

/* ── Carteles ───────────────────────────────────────────────── */
#cap{position:absolute;left:84px;top:900px;display:flex;align-items:center;gap:18px;padding:16px 28px 16px 16px;border-radius:20px;background:rgba(255,255,255,.97);
  box-shadow:0 24px 60px rgba(2,6,23,.40),0 0 0 1px rgba(15,23,42,.06);opacity:0;will-change:transform,opacity;max-width:900px}
#capN{flex:none;width:48px;height:48px;border-radius:14px;background:linear-gradient(140deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;
  font:700 24px/1 'Geist';letter-spacing:-.02em;box-shadow:0 6px 14px rgba(37,99,235,.35)}
#capN.icon{font-size:22px}
#capT{font:650 30px/1.1 'Geist';color:var(--text);letter-spacing:-.022em;white-space:nowrap}
#capS{font:500 19px/1.25 'Geist';color:var(--muted);letter-spacing:-.01em;margin-top:5px;white-space:nowrap}

/* ── Placa de capítulo ──────────────────────────────────────── */
#capitulo{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;pointer-events:none}
#capK{padding:11px 24px;border-radius:999px;background:rgba(59,130,246,.20);border:1px solid rgba(147,197,253,.50);color:#BFDBFE;font:700 22px/1 'Geist';letter-spacing:.16em;text-transform:uppercase}
#capTit{font:600 78px/1.05 'Sora';letter-spacing:-.035em;color:#fff;text-align:center;text-shadow:0 10px 50px rgba(2,6,23,.65)}
#capSub{font:500 29px/1.3 'Geist';letter-spacing:-.01em;color:rgba(226,232,240,.92);text-align:center}

/* ── Intro / cierre ─────────────────────────────────────────── */
#veil{position:absolute;inset:0;background:#fff}
#veil .glow{position:absolute;inset:0;background:radial-gradient(ellipse 900px 900px at 50% 44%, rgba(59,130,246,.09) 0%, transparent 70%)}
#logo{position:absolute;left:50%;top:0;width:0;height:0}
#logoSpin{position:absolute;left:-110px;top:-110px;width:220px;height:220px}
.ring{position:absolute;left:-110px;top:-110px;width:220px;height:220px;border-radius:50%}
#brand{position:absolute;left:0;width:1920px;text-align:center;font:700 56px/1 'Geist';letter-spacing:-.02em;color:var(--text)}
#title{position:absolute;left:0;width:1920px;text-align:center;font:600 46px/1.15 'Sora';letter-spacing:-.03em;color:var(--text)}
#site{position:absolute;left:50%;transform:translateX(-50%);padding:12px 26px;border-radius:999px;background:#EFF6FF;color:#1D4ED8;font:600 26px/1 'Geist';letter-spacing:-.01em;border:1px solid #DBEAFE}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <svg id="rings" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
  <svg id="noise" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <canvas id="cam" width="1920" height="1080"></canvas>

  <div id="dlg">
    <div class="tb">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" fill="#FFC83D"/><path d="M3 9h18v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="#FFD75E"/></svg>
      <span>Abrir</span>
      <div class="x"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="#333" stroke-width="1.1"/></svg></div>
    </div>
    <div class="tool">
      <div class="ib"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="#666" stroke-width="1.3"/></svg></div>
      <div class="ib"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="#AAA" stroke-width="1.3"/></svg></div>
      <div class="ib"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="#666" stroke-width="1.3"/></svg></div>
      <div class="addr">
        <svg width="16" height="16" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="#7FB3E8"/><circle cx="9" cy="10" r="2" fill="#fff"/><path d="M5 17l5-5 3 3 2-2 4 4z" fill="#3D7CC9"/></svg>
        <span class="sep">›</span><span>Este equipo</span><span class="sep">›</span><span id="dlgRuta">Imágenes</span>
      </div>
      <div class="search"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#777" stroke-width="1.2"/><path d="M10.5 10.5L14 14" stroke="#777" stroke-width="1.2"/></svg><span id="dlgBuscar">Buscar en Imágenes</span></div>
    </div>
    <div class="cmd">
      <span>Organizar <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5l3 3 3-3" fill="none" stroke="#333"/></svg></span>
      <span>Nueva carpeta</span>
      <span style="margin-left:auto;color:#555"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" fill="none" stroke="#555"/><rect x="9" y="2" width="5" height="5" fill="none" stroke="#555"/><rect x="2" y="9" width="5" height="5" fill="none" stroke="#555"/><rect x="9" y="9" width="5" height="5" fill="none" stroke="#555"/></svg></span>
    </div>
    <div class="nav">
      <div>🏠&nbsp;Inicio</div><div>🖼️&nbsp;Galería</div><hr>
      <div>🖥️&nbsp;Escritorio</div><div>⬇️&nbsp;Descargas</div><div>📄&nbsp;Documentos</div><div class="sel">🖼️&nbsp;Imágenes</div><div>🎵&nbsp;Música</div><div>🎬&nbsp;Videos</div><hr><div>💻&nbsp;Este equipo</div>
    </div>

      <div class="row1">
        <span>Nombre:</span>

      </div>

  </div>
  <div id="key">⇧ Shift</div>

  <canvas id="cur" width="1920" height="1080"></canvas>

  <div id="cap"><div id="capN">1</div><div><div id="capT"></div><div id="capS"></div></div></div>
  <div id="capitulo"><div id="capK"></div><div id="capTit"></div><div id="capSub"></div></div>

  <div id="veil">
    <div class="glow"></div>
    <div id="logo">
      <div class="ring" id="ring1"></div>
      <div class="ring" id="ring2"></div>
      <svg id="logoSpin" viewBox="0 0 88 88" fill="none">
        <circle id="hubHalo" cx="44" cy="44" r="18" fill="rgba(59,130,246,.10)"/>
        <g id="spinG">
          <circle id="arc" cx="44" cy="44" r="32" stroke-width="3" stroke="#3B82F6" stroke-linecap="round" stroke-dasharray="151 50" transform="rotate(-90 44 44)"/>
          <circle id="satHalo" cx="44" cy="12" r="9" fill="rgba(37,99,235,.22)"/>
          <circle id="sat" cx="44" cy="12" r="5.5" fill="#2563EB"/>
        </g>
        <circle id="hub" cx="44" cy="44" r="10" fill="#0F172A"/>

    </div>
    <div id="brand">Órbita</div>

    <div id="site">orbita.site</div>
  </div>
</div>

<script>
// ── Utilidades ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id)
const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
const lerp = (a, b, u) => a + (b - a) * u
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1)
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2
const eo = u => 1 - Math.pow(1 - u, 3)
const eo5 = u => 1 - Math.pow(1 - u, 5)
const smooth = u => u * u * u * (u * (u * 6 - 15) + 10)
const spring = (u, k = 1) => u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.exp(-6 * u) * Math.cos(9.5 * u * k)

let TL = null
// Ventana en coordenadas de "mundo" (stage a zoom 1)
const WX = 240, WY = 68, WW = 1440, WH = 944, CH = 44, SY = WY + CH
const scr = (x, y) => [WX + x, SY + y]          // pantalla (px CSS del panel) → mundo

// ── Fondo ─────────────────────────────────────────────────────────────────
function drawRings(t) {
  const cx = 1500, cy = 120
  let html = ''
  ;[260, 470, 700, 960, 1240].forEach((r, i) => {
    html += `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * 0.62}" fill="none" stroke="rgba(147,197,253,${0.10 - i * 0.012})" stroke-width="1.2" transform="rotate(-18 ${cx} ${cy})"/>`
  })
  ;[[470, 0.035, 0], [960, 0.018, 2.1]].forEach(([r, w, ph]) => {
    const a = ph + t * w * Math.PI * 2, rot = -18 * Math.PI / 180
    const x0 = Math.cos(a) * r, y0 = Math.sin(a) * r * 0.62
    const x = cx + x0 * Math.cos(rot) - y0 * Math.sin(rot), y = cy + x0 * Math.sin(rot) + y0 * Math.cos(rot)
    html += `<circle cx="${x}" cy="${y}" r="10" fill="rgba(147,197,253,.10)"/><circle cx="${x}" cy="${y}" r="4" fill="rgba(191,219,254,.55)"/>`
  })
  $('rings').innerHTML = html
}

// ── Logo del loader ───────────────────────────────────────────────────────
function drawLogo(a, cy, alpha) {
  const L = $('logo')
  L.style.top = cy + 'px'; L.style.opacity = alpha
  $('hub').setAttribute('r', (10 * spring(prog(a, 0, .55))).toFixed(3))
  $('hubHalo').setAttribute('r', (18 * spring(prog(a, .08, .65))).toFixed(3))
  const arcU = eo(prog(a, .12, .85)), C = 2 * Math.PI * 32
  $('arc').setAttribute('stroke-dasharray', `${(151 * arcU).toFixed(2)} ${(C - 151 * arcU).toFixed(2)}`)
  $('arc').style.opacity = arcU > 0 ? 1 : 0
  const satU = eo(prog(a, .35, .7))
  $('sat').setAttribute('r', (5.5 * satU).toFixed(3)); $('satHalo').setAttribute('r', (9 * satU).toFixed(3))
  const ang = (a < .9 ? 360 * (a * a / 1.8) : 360 * (.45 + (a - .9))) % 360
  $('spinG').setAttribute('transform', `rotate(${ang.toFixed(2)} 44 44)`)
  const ringsOn = prog(a, .55, 1)
  ;[['ring1', 0, .35], ['ring2', .75, .20]].forEach(([id, d, op]) => {
    const el = $(id), k = a - .55 - d
    if (k < 0) { el.style.opacity = 0; return }
    const u = (k % 2) / 2, e = 1 - Math.pow(1 - u, 2)
    el.style.border = `3.75px solid rgba(59,130,246,${op})`
    el.style.transform = `scale(${lerp(.85, 2.2, e)})`
    el.style.opacity = (1 - e) * ringsOn
  })
}
function fadeUp(el, t, a, dur = .6, dist = 34) { const u = eo5(prog(t, a, a + dur)); el.style.opacity = u; return (1 - u) * dist }

// ── Tiempo de salida → fuente ─────────────────────────────────────────────
function segAt(t) {
  const S = TL.segs; let lo = 0, hi = S.length - 1, idx = 0
  while (lo <= hi) { const m = (lo + hi) >> 1; if (S[m].o0 <= t) { idx = m; lo = m + 1 } else hi = m - 1 }
  return idx
}
function srcTime(t, i = segAt(t)) {
  const s = TL.segs[i], u = clamp((t - s.o0) / Math.max(1e-6, s.o1 - s.o0), 0, 1)
  return lerp(s.s0, s.s1, s.ease ? smooth(u) : u)
}
function frameAt(s) {
  const F = TL.frames; let lo = 0, hi = F.length - 1, idx = 0
  while (lo <= hi) { const m = (lo + hi) >> 1; if (F[m].s <= s + 1e-6) { idx = m; lo = m + 1 } else hi = m - 1 }
  return F[idx].f
}
function urlAt(s) { let u = TL.urls[0]?.u ?? ''; for (const e of TL.urls) if (e.s <= s) u = e.u; return u }

// ── Cámara: un rectángulo de "mundo" que se ve en pantalla ────────────────
// Cada objetivo (foco en px de pantalla + zoom) se convierte en un
// rectángulo {cx, cy, w}; entre dos rectángulos se interpola el ancho en forma
// geométrica y el centro con el MISMO peso que el ancho, así el movimiento es
// un zoom sobre un punto fijo, sin quiebres. Todo se dibuja en canvas con
// posición subpíxel (nada se redondea a píxeles enteros: sin temblor).
const R0 = { cx: 960, cy: 540, w: 1920 }
function rectObjetivo(k) {
  const z = k.z ?? 1
  if (z <= 1.0001) return { ...R0 }
  const w = 1920 / z, h = 1080 / z
  let [fx, fy] = scr(k.x ?? 720, k.y ?? 450)
  const b = smooth(clamp((z - 1) / .35, 0, 1))
  fx = lerp(960, fx, b); fy = lerp(540, fy, b)
  const loX = WX + w / 2, hiX = WX + WW - w / 2
  fx = loX <= hiX ? clamp(fx, loX, hiX) : clamp(fx, hiX, loX)
  const loY = WY + h / 2, hiY = WY + WH - h / 2
  fy = loY <= hiY ? clamp(fy, loY, hiY) : clamp(fy, hiY, loY)
  return { cx: fx, cy: fy, w }
}
function interpRect(A, B, s) {
  const w = A.w * Math.pow(B.w / A.w, s)
  const g = Math.abs(B.w - A.w) > .5 ? (w - A.w) / (B.w - A.w) : s
  return { cx: lerp(A.cx, B.cx, g), cy: lerp(A.cy, B.cy, g), w }
}
let CAM = []
function prepararCamara() {
  const ks = [...TL.cam].sort((a, b) => a.t - b.t)
  let prev = null, from = { ...R0 }
  CAM = []
  for (const k of ks) {
    let t = k.t
    if (prev && t < prev.t + prev.d) t = prev.t + prev.d      // sin solapes
    const kk = { t, d: Math.max(.05, k.d), from, to: rectObjetivo(k) }
    CAM.push(kk); from = kk.to; prev = kk
  }
}
function camAt(t) {
  let r = { ...R0 }
  for (const k of CAM) { if (t < k.t) break; r = t >= k.t + k.d ? k.to : interpRect(k.from, k.to, smooth((t - k.t) / k.d)) }
  return r
}
// Entrada/salida de la ventana (sobre el mundo, antes de la cámara)
function winAnim(t) {
  const OUT = TL.duration - (TL.outro ?? 5.4)
  const inU = eo5(prog(t, 2.55, 3.55)), outU = eio(prog(t, OUT, OUT + .9))

// ── Carteles: la esquina libre de cada paso ───────────────────────────────
const CORNERS = ['BL', 'BR', 'TL', 'TR']

function prepararCarteles() {
  const C = TL.caps, cap = $('cap')

  // medir cada cartel
  cap.style.opacity = 0
  for (const c of C) {

    const w = Math.max(...g.map(c => c.w)), h = Math.max(...g.map(c => c.h))

      const p = cornerPos(corner, w, h), R = { x: p.x - 40, y: p.y - 40, w: w + 80, h: h + 80 }

  } else if (t >= OUT + .35) {
    veil.style.display = 'block'
    veil.style.clipPath = `path("${circlePath(960, 540, lerp(0, 2300, eio(prog(t, OUT + .35, OUT + 1.25))))}")`
    const a0 = OUT + 1.0, LY = 400
    drawLogo(t - a0, LY, 1); $('logo').style.transform = 'none'
    $('brand').style.opacity = 0
    const tY = LY + 165
    $('title').textContent = TL.endTitle
    $('title').style.top = (tY + fadeUp($('title'), t, a0 + .7, .65, 30)) + 'px'
    $('site').style.top = (tY + 96 + fadeUp($('site'), t, a0 + 1.15, .6, 24)) + 'px'
  } else veil.style.display = 'none'
  return true
}

async function load(tl) {
  TL = tl
  await document.fonts.ready
  await Promise.all([document.fonts.load('500 14px Geist'), document.fonts.load('650 30px Geist'), document.fonts.load('600 46px Sora'), ...[...document.fonts].map(f => f.load().catch(() => {}))])
  prepararCamara()
  await prepararDialogo()
  prepararCarteles()
  return TL.caps.map(c => `${c.n} ${c.corner}`)
}
window.seek = seek; window.load = load
</script>
