<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <radialGradient id="glowOrbi" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#05080F" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#05080F" />
  <rect width="800" height="450" fill="url(#glowOrbi)" />

  <!-- Top bar del panel -->
  <rect x="44" y="34" width="712" height="58" rx="12" fill="#0B101D" stroke="#1B2439" stroke-width="1.5" />
  <text x="68" y="68" fill="#7E89A6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Ventas</text>
  <text x="116" y="68" fill="#556079" font-family="system-ui, -apple-system, sans-serif" font-size="13">›</text>
  <text x="130" y="68" fill="#E8EDF7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Inicio</text>

  <!-- Buscador simulado -->
  <rect x="356" y="45" width="176" height="36" rx="9" fill="#05080F" stroke="#1B2439" />
  <circle cx="376" cy="63" r="5" stroke="#556079" stroke-width="1.5" />
  <line x1="380" y1="67" x2="384" y2="71" stroke="#556079" stroke-width="1.5" stroke-linecap="round" />
  <text x="394" y="67" fill="#556079" font-family="system-ui, -apple-system, sans-serif" font-size="12">Buscar en Orbita...</text>

  <!-- Boton destacado de Orbi AI -->
  <rect x="544" y="45" width="110" height="36" rx="18" fill="#151D31" stroke="#60A5FA" stroke-width="1.5" />
  <circle cx="564" cy="63" r="10" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA" stroke-width="1.2" />
  <circle cx="564" cy="63" r="3.5" fill="#60A5FA" />
  <text x="582" y="67" fill="#E8EDF7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Orbi AI</text>

  <!-- Campana y Avatar -->
  <rect x="666" y="45" width="36" height="36" rx="9" fill="#0B101D" stroke="#1B2439" />
  <path d="M684 56a4 4 0 0 1 4 4c0 4 2 5 2 5h-12s2-1 2-5a4 4 0 0 1 4-4Z" stroke="#A9B4CB" stroke-width="1.4" stroke-linejoin="round" />
  <circle cx="728" cy="63" r="15" fill="#3B82F6" />
  <text x="728" y="67" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">OP</text>

  <!-- Panel lateral del asistente Orbi -->
  <rect x="260" y="110" width="496" height="306" rx="14" fill="#0B101D" stroke="#2D3A59" stroke-width="1.5" />
  <rect x="260" y="110" width="496" height="48" rx="14" fill="#0E1526" />
  <line x1="260" y1="158" x2="756" y2="158" stroke="#1B2439" />
  <circle cx="288" cy="134" r="11" fill="#60A5FA" fill-opacity="0.16" stroke="#60A5FA" stroke-width="1.4" />
  <circle cx="288" cy="134" r="4" fill="#60A5FA" />
  <text x="310" y="138" fill="#E8EDF7" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Asistente Orbi AI</text>
  <rect x="684" y="122" width="54" height="24" rx="6" fill="#151D31" stroke="#2D3A59" />
  <text x="711" y="138" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Ctrl K</text>

  <!-- Mensaje del usuario -->
  <rect x="444" y="176" width="292" height="38" rx="10" fill="#151D31" stroke="#2D3A59" />
  <text x="462" y="199" fill="#E8EDF7" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">¿Cuánto vendí esta semana y qué pedidos faltan?</text>

  <!-- Respuesta de Orbi -->
  <rect x="282" y="228" width="414" height="122" rx="10" fill="#05080F" stroke="#1B2439" />
  <text x="300" y="252" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Resumen en tiempo real de tu tienda</text>
  <text x="300" y="274" fill="#A9B4CB" font-family="system-ui, -apple-system, sans-serif" font-size="12">Facturaste $ 482.500 en 19 pedidos (+18% vs. la semana pasada).</text>
  <text x="300" y="294" fill="#A9B4CB" font-family="system-ui, -apple-system, sans-serif" font-size="12">Tenés 4 pedidos pendientes de preparación para despachar hoy.</text>

  <!-- Accion sugerida dentro de la respuesta -->
  <rect x="300" y="310" width="152" height="26" rx="7" fill="#60A5FA" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.45" />
  <text x="314" y="327" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Abrir Pedidos pendientes</text>

  <!-- Barra de prompt inferior -->
  <rect x="282" y="366" width="454" height="34" rx="9" fill="#05080F" stroke="#1B2439" />
  <text x="300" y="387" fill="#556079" font-family="system-ui, -apple-system, sans-serif" font-size="12">Preguntale sobre ventas, productos, clientes o configuración...</text>
  <rect x="698" y="371" width="32" height="24" rx="6" fill="#60A5FA" />
  <path d="M710 383h8m-3-3 3 3-3 3" stroke="#05080F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tarjeta izquierda de contexto -->
  <rect x="44" y="110" width="198" height="142" rx="12" fill="#0B101D" stroke="#1B2439" />
  <text x="64" y="140" fill="#7E89A6" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Contexto automático</text>
  <text x="64" y="166" fill="#E8EDF7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Datos de tu negocio</text>
  <rect x="64" y="186" width="158" height="22" rx="6" fill="#34D399" fill-opacity="0.12" />
  <circle cx="76" cy="197" r="3" fill="#34D399" />
  <text x="86" y="201" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Acceso directo con Ctrl+K</text>
  <rect x="64" y="216" width="158" height="22" rx="6" fill="#151D31" />
  <text x="74" y="231" fill="#A9B4CB" font-family="system-ui, -apple-system, sans-serif" font-size="11">Respuestas con navegación</text>
</svg>
