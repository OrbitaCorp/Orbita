# Variables de entorno NO sensibles para el deploy a Cloud Run.
# Esto SÍ se commitea a git — no hay secrets acá adentro. Los valores
# sensibles (DATABASE_URL, JWT_SECRET, API keys, etc.) viven en Secret
# Manager y se referencian aparte en deploy.sh (--set-secrets).
#
# Si agregás una variable nueva NO sensible a apps/api, agregala acá.
# Si es sensible, agregala como secret nuevo (ver DEPLOYMENT.md § Secrets)
# y referencialo en deploy.sh, no acá.

NODE_ENV: "production"
FRONTEND_URL: "https://orbita.site"
GOOGLE_CLIENT_ID: "271663449184-phgk621gvpo1cdjrknbrmjdo3tljn48q.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI: "https://api.orbita.site/api/v1/auth/google/callback"
JWT_EXPIRES_IN: "15m"
MAIL_FROM: '"Órbita" <no-reply@orbita-corp.com>'
MERCADOPAGO_CLIENT_ID: "8070226964676720"
MERCADOPAGO_REDIRECT_URI: "https://api.orbita.site/api/v1/mercadopago/oauth/callback"
# OJO - riesgo real de negocio (ver subscriptions.service.ts, comentario del
# getter `bienvenida`): con esto en "true", el beneficio de bienvenida de
# CUALQUIER alta real (no solo la de prueba de quien lo prendió) cobra
# MP_SUBSCRIPTION_AMOUNT en vez de $5.500. Es a propósito, para probar el
# checkout real gastando poco - pero hay que apagarlo (borrar esta línea o
# ponerla en "false") y volver a desplegar apenas termine la prueba. Ya pasó
# una vez que quedó prendido sin querer y le cobró $15 a negocios reales en
# vez de $5.000.
MP_PLAN_OVERRIDE: "true"
MP_SUBSCRIPTION_AMOUNT: "15"
MP_SUBSCRIPTION_FREQUENCY: "3"
MP_SUBSCRIPTION_FREQUENCY_TYPE: "days"
SUBSCRIPTION_ABANDONED_DAYS: "7"
SUBSCRIPTION_SWEEP_DELETE: "false"
# Saltos de proxy delante de la API (Firebase Hosting + el balanceador de
# Cloud Run). Medido el 12/09 con GET /api/v1/health/ip, 3 muestras: el
# X-Forwarded-For llega siempre con 2 entradas (IP real del cliente, IP de
# Google) y req.ip es la interna de Cloud Run — con 1, Express tomaría la de
# Google; con 2 toma la del cliente. Nunca "true": esa la escribe el cliente
# y cualquiera se saltearía los límites (ver common/utils/proxy.ts).
#
# OJO: esto arregla los pedidos que van del navegador a la API. Los que pasan
# por el BFF de Next.js (login, refresh, registro) siguen llegando todos con
# la IP de Vercel — es la segunda mitad del hallazgo rate-limit-ip-proxy, que
# necesita que el BFF reenvíe la IP con un secreto compartido.
TRUST_PROXY_HOPS: "2"
# SUPABASE_URL vive en Secret Manager (no acá) — ver SECRETS en deploy.sh.
